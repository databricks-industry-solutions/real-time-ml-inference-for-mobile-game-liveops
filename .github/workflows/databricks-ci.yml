name: Databricks Asset Bundles CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Lint + unit tests + bundle validation. The full pipeline is NOT deployed or run per
# PR: it trains on serverless GPU and deploys always-on serving endpoints, so a
# per-PR run would be slow and costly. Deploy manually (docs/DEPLOYMENT.md).
jobs:
  validate-and-test:
    runs-on: html_publisher

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java (local Spark tests)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dev dependencies
        run: uv venv --python 3.12 && uv pip install -e '.[dev]'

      - name: Lint
        run: .venv/bin/ruff check src/ tests/ jobs/ app/

      - name: Unit tests
        run: PYTHONPATH=src .venv/bin/python -m pytest tests/ -q

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST: 'https://e2-demo-field-eng.cloud.databricks.com'
          DATABRICKS_TOKEN: ${{ secrets.DEPLOY_NOTEBOOK_TOKEN }}
        run: databricks bundle validate --target dev --var="catalog=main"
