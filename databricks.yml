bundle:
  name: offer-recommender

# Build the offer_recommender package as a wheel so job tasks can import it. The Spark /
# feature-store / serving tasks install this wheel; the app builds separately
# from app/requirements.txt.
artifacts:
  offer_recommender_wheel:
    type: whl
    build: uv build --wheel
    path: .
  # Renders each GPU task's hyperparameters.yaml from this deploy's variables. AI
  # Runtime exposes it as HYPERPARAMETERS_PATH and jobs/train_multinode/ray_bootstrap.sh
  # exports its keys, so deploy-time values reach the GPU nodes without a preview.
  gpu_task_config:
    path: .
    build: |
      python3 jobs/gpu_task_config.py jobs/train_multinode/hyperparameters.yaml RECO_CATALOG=${var.catalog} RECO_SCHEMA=${var.schema} RECO_EPOCHS=${var.train_epochs}
      python3 jobs/gpu_task_config.py jobs/tune/hyperparameters.yaml RECO_CATALOG=${var.catalog} RECO_SCHEMA=${var.schema}

# The rendered hyperparameters.yaml files are git-ignored but must reach the workspace.
sync:
  include:
    - jobs/*/hyperparameters.yaml

# Every deployment-specific value is a bundle variable. Set them in `.env` (copied
# from `env.example`) as BUNDLE_VAR_<name>=...; the Databricks CLI reads those
# natively, so nothing workspace-specific ever lives in this file.
variables:
  catalog:
    description: "REQUIRED. Existing Unity Catalog catalog that will hold the project schema."
  schema:
    description: "Dedicated UC schema for this project's tables, volume, features and model."
    default: "offer_recommender"
  prefix:
    description: "Unique prefix for the app name (hyphen-safe)."
    default: "offer-reco"
  train_gpus:
    description: "Total GPUs for the AI Runtime training workload. AIR provisions num_accelerators / GPUs-per-node nodes (16 x GPU_8xH100 = 2 nodes)."
    default: "1"
  gpu_accelerator_type:
    description: "AI Runtime accelerator: GPU_1xA10, GPU_1xH100 or GPU_8xH100. Every node uses the same type; set train_gpus above the GPUs per node for multi-node."
    default: "GPU_1xA10"
  train_epochs:
    description: "Training epochs. Lower it (e.g. 3) for a fast smoke run."
    default: "40"
  fs_reset:
    description: "Force feature-store re-materialization after a feature-set change. Resolved at `bundle deploy`, not `bundle run`."
    default: "false"
  kafka_bootstrap:
    description: "REQUIRED. Kafka bootstrap (host:port), e.g. `<namespace>.servicebus.windows.net:9093` for Azure Event Hubs. setup_stream, preprocess and the producer fail if it is empty."
    default: ""
  kafka_uc_connection:
    description: "UC Kafka connection (SASL/PLAIN) the managed Streaming Feature View authenticates with; created by provisioning/provision_databricks.sh. Empty = mTLS against a self-managed broker (certs on the UC Volume)."
    default: ""
  session_end_ts:
    description: "Pinned session-window end (unix seconds). generate_data and setup_stream both use it so label and backfill windows match. Set once per install."
    default: "1785369600"
  login_rate:
    description: "Synthetic logins/sec the producer emits. Endpoints without route optimization are limited to 200 QPS per workspace, so keep it below that unless the ranking endpoint is route-optimized."
    default: "150"
  # Event Hubs auth is NOT a bundle variable: the SAS connection string lives in the
  # `offer-reco-kafka` secret scope (see resources/secrets.yml), put there by
  # provisioning/provision_databricks.sh.

include:
  - resources/*.yml
  # Optional, git-ignored extra targets for your own deployments (see env.example).
  - "*.local.yml"

# No workspace host here on purpose: it comes from DATABRICKS_CONFIG_PROFILE /
# DATABRICKS_HOST (set in .env) or `-p <profile>`. mode: production requires an
# explicit root_path; this one keeps one copy per deploying user and target.
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  # Both targets use mode: production (no dev_<user>_ object-name prefixing) so the UC
  # schema stays the literal `offer_recommender`: the streaming feature
  # materialization's Lakebase sink quotes a prefixed schema name and its own
  # validator rejects quoted identifiers, so streaming features never reach the
  # online store under development mode.
  dev:
    default: true
    mode: production
  prod:
    mode: production
