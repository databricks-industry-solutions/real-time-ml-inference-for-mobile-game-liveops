# Multi-node Ray Train workload for the Databricks AI Runtime (`air` CLI).
#
# This is a TEMPLATE: `jobs/train_multinode_launcher.py` substitutes the
# {{PLACEHOLDER}} tokens (GPU count, accelerator type, UC location, epochs) with the
# DAB-injected values at launch, writes the rendered copy to a temp path, and runs
# `air run -f <rendered> --watch`.
#
# HONESTY: the ranker is tiny and does NOT need multi-node. The only honest reason
# to span nodes is data-parallel throughput over a large impression log. A cheap
# single-node run is the SAME workload with num_accelerators: 1 (--var train_gpus=1).
# AIR is Public Preview.
experiment_name: {{EXPERIMENT_NAME}}

# Named AI env: ray + torch (2.9.0+cu129) come PREINSTALLED, so there is no per-run
# ~2.5GB pip install (this is the sanctioned path per the official ray-train docs;
# requires the workspace "serverless workspace base environment" preview). air still
# requires an inline `dependencies` list alongside `version`; list only what the AI
# env lacks (fsspec for the Volume-parquet read, mlflow for run logging). The
# offer_recommender package ships to the nodes via code_source below (PYTHONPATH),
# NOT pip. If the named env is ever unavailable, fall back to version '5' + inline
# torch>=2.2 + ray[data,train]>=2.55.
environment:
  version: 'databricks_ai_v5'
  dependencies:
    - fsspec>=2024.6.1
    - mlflow>=3.0

# num_accelerators across accelerator_type nodes -> AIR auto-provisions the nodes
# (e.g. 16 x GPU_8xH100 = 2 nodes of 8 GPUs) and sets the rendezvous env vars.
compute:
  num_accelerators: {{TRAIN_GPUS}}
  accelerator_type: {{GPU_ACCELERATOR_TYPE}}

# Ship the repo (the offer_recommender package + the driver) to every node.
# root_path MUST be an ABSOLUTE path (air requirement) -- the launcher renders the
# synced repo root here. The remote code lands at /databricks/code_source/<final
# path component of root_path> and AIR sets $CODE_SOURCE_PATH to it.
code_source:
  type: snapshot
  snapshot:
    root_path: {{REPO_ROOT}}

# Export the driver's config, then hand off to the shared bootstrap script (the
# sanctioned pattern: head on NODE_RANK=0, workers join, node 0 runs RAY_ENTRYPOINT).
# The GPU node reads training data as parquet off the Volume (RECO_CATALOG/SCHEMA ->
# uc.volume_path in the driver); no warehouse / host / token needed here.
command: |
  cd $CODE_SOURCE_PATH
  export RECO_CATALOG="{{RECO_CATALOG}}"
  export RECO_SCHEMA="{{RECO_SCHEMA}}"
  export RECO_TOTAL_GPUS="{{TRAIN_GPUS}}"
  export RECO_EPOCHS="{{RECO_EPOCHS}}"
  export PYTHONPATH="$CODE_SOURCE_PATH/src:$CODE_SOURCE_PATH/jobs/train_multinode:$PYTHONPATH"
  export RAY_ENTRYPOINT="jobs/train_multinode/train_ray.py"
  bash jobs/train_multinode/ray_bootstrap.sh

max_retries: 0
timeout_minutes: 90
env_variables:
  NCCL_SOCKET_IFNAME: eth0
