# Secret scope for the OPTIONAL Kafka real-time path (Azure Event Hubs, SASL/PLAIN).
#
# DAB owns the SCOPE (declarative, torn down with the bundle); it deliberately
# does NOT hold the secret VALUE (values never belong in Git). The scope holds the
# key `eventhub_connection_string` = the Event Hubs SAS connection string, read by
# the producer (jobs/produce_events.py) and the app login consumer for SASL/PLAIN.
# The managed SFV instead authenticates via the UC Kafka connection
# (var.kafka_uc_connection), not this secret. Populate at deploy time:
#
#   databricks secrets put-secret offer-reco-kafka eventhub_connection_string \
#     --string-value "$EH_CONNECTION_STRING" -p <profile>
#
# Only needed when the Kafka path is enabled (var.kafka_bootstrap set); harmless
# (empty) otherwise.
resources:
  secret_scopes:
    offer_reco_kafka:
      name: offer-reco-kafka
      permissions:
        - level: READ
          service_principal_name: ${workspace.current_user.userName}
      # NOTE: the App's own service principal ALSO needs READ (its login consumer reads
      # the Event Hubs connection string at startup), but the app SP id isn't known until
      # the app is created and DAB does not expose it for interpolation here. `bundle
      # deploy` reconciles this scope's ACLs to the list above, STRIPPING any extra grant
      # -- so after EVERY deploy, re-grant the app SP manually (see docs/DEPLOYMENT.md):
      #   databricks secrets put-acl offer-reco-kafka <app-sp-client-id> READ -p <profile>
